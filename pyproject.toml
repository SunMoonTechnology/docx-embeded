[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "docx-embed"
version = "0.1.0"
description = "Embed file attachments (OLE Package icons) into Word .docx at paragraph / heading positions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "docx-embed contributors" }]
keywords = ["docx", "word", "ole", "attachment", "embed", "ooxml"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Office Suites",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/example/docx-embed"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docx_embed = ["*.dib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
